<svg xmlns="http://www.w3.org/2000/svg" width="840" viewBox="0 0 840 408" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="14">
